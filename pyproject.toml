[project]
name = "PCP-Back"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.162.2",
    "pwdlib[bcrypt]>=0.4.2",
